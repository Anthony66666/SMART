# Local single-GPU causal diffusion smoke/training config.
time_info: &time_info
  num_historical_steps: 11
  num_future_steps: 80
  use_intention: True
  token_size: 2048

Dataset:
  root:
  train_batch_size: 1
  val_batch_size: 1
  test_batch_size: 1
  shuffle: True
  num_workers: 4
  pin_memory: True
  persistent_workers: True
  train_raw_dir: ["/home/anthony/SimAgentJEPA/data/waymo/training_subset_10pct"]
  val_raw_dir: ["/home/anthony/SimAgentJEPA/data/waymo/validation"]
  test_raw_dir:
  transform: WaymoTargetBuilder
  train_processed_dir:
  val_processed_dir:
  test_processed_dir:
  dataset: "scalable"
  <<: *time_info

Trainer:
  strategy: ddp_find_unused_parameters_false
  accelerator: "gpu"
  devices: 1
  max_epochs: 5
  save_ckpt_path:
  num_nodes: 1
  mode:
  ckpt_path:
  precision: 32
  accumulate_grad_batches: 1
  limit_val_batches: 20
  check_val_every_n_epoch: 1
  monitor_metric: "val_rollout_score"
  monitor_mode: "min"

Visualization:
  enabled: true
  interval_epochs: 1
  sample_indices: [0, 1, 2, 3]
  output_dir: "./outputs/val_causal_diffusion_local"
  max_agents: 0
  step_viz:
    enabled: true
    interval_steps: 1000
    sample_indices: [0, 1, 2, 3]
    output_dir: "./outputs/step_causal_diffusion_local"

Model:
  mode: "train"
  predictor: "smart_causal_diffusion"
  dataset: "waymo"
  input_dim: 2
  hidden_dim: 128
  output_dim: 2
  output_head: False
  num_heads: 8
  <<: *time_info
  head_dim: 16
  dropout: 0.1
  num_freq_bands: 64
  lr: 0.0005
  warmup_steps: 500
  total_steps: 10000
  inference_token: True
  rollout_num: 1
  decoder:
    <<: *time_info
    num_map_layers: 3
    num_agent_layers: 6
    a2a_radius: 60
    pl2pl_radius: 10
    pl2a_radius: 30
    time_span: 30
  diffusion:
    future_chunk_steps: 5
    history_tokens: 2
    prediction_tokens: 4
    commit_tokens: 1
    carry_tail_proposal: false
    token_steps: 5
    total_rollout_steps: 80
    local_map_refresh: rescreen
    rolling_anchor_training: true
    state_perturb_pos_sigma_m: 0.3
    state_perturb_heading_sigma_rad: 0.05
    closed_loop_max_depth: 4
    # Local 50-scene perturbed P99 seed; recalibrate on the full training set.
    retokenization_error_thresholds: [0.65, 0.78, 0.62]
    continuous_recovery_loss_weight: 1.0
    frontier_loss_weight: 1.0
    encoder_lr_scale: 0.5
    num_steps: 16
    num_layers: 6
    eps: 1.0e-3
    min_t: 1.0e-3
    ntp_aux_loss_weight: 0.0
    use_agent_context: true
    use_type_embedding: true
    use_map_context: true
    max_map_tokens: 0
    geometry_dropout_prob: 0.0
    visible_token_corruption_prob: 0.0
    target_category_only: true
    agent_selection_mode: smart_inference
    supervision_mode: smart_category3
    metric_mode: smart_val_compatible
    remask_confidence_temperature: 1.0
    geometry_confidence_source_threshold: 0.2
    safety_energy_enabled: true
    safety_topk: 16
    safety_energy_weight: 1.0
    lane_distance_energy_weight: 1.0
    lane_heading_energy_weight: 0.5
    dynamics_energy_weight: 0.25
    collision_energy_weight: 2.0
    trajectory_dt: 0.1
    max_acceleration: 6.0
    max_yaw_rate: 1.2
    collision_distance: 2.0
    eval_inference_batches: 2
    debug_validation_logging: true
    freeze_encoder: false
