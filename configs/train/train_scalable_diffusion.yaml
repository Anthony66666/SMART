# SMART-Diffusion training config — discrete mask diffusion replaces autoregressive generation
time_info: &time_info
  num_historical_steps: 11
  num_future_steps: 80
  use_intention: True
  token_size: 2048

Dataset:
  root:
  train_batch_size: 4
  val_batch_size: 4
  test_batch_size: 1
  shuffle: True
  num_workers: 4
  pin_memory: True
  persistent_workers: True
  train_raw_dir: ["/raid/haoq_lab/wangshijie/data/waymo/training"]
  val_raw_dir: ["/raid/haoq_lab/wangshijie/data/waymo/validation"]
  test_raw_dir:
  transform: WaymoTargetBuilder
  train_processed_dir:
  val_processed_dir:
  test_processed_dir:
  dataset: "scalable"
  <<: *time_info

Trainer:
  strategy: ddp_find_unused_parameters_false
  accelerator: "gpu"
  devices: 14
  max_epochs: 32
  save_ckpt_path:
  num_nodes: 1
  mode:
  ckpt_path:
  precision: 32
  accumulate_grad_batches: 1
  monitor_metric: "val_loss"
  monitor_mode: "min"

Visualization:
  enabled: true
  interval_epochs: 1
  sample_indices: [0, 1, 2, 3]
  output_dir: "./outputs/val_visualizations"
  max_agents: 0

Model:
  mode: "train"
  predictor: "smart_diffusion"
  dataset: "waymo"
  input_dim: 2
  hidden_dim: 128
  output_dim: 2
  output_head: False
  num_heads: 8
  <<: *time_info
  head_dim: 16
  dropout: 0.1
  num_freq_bands: 64
  lr: 0.0005
  warmup_steps: 0
  total_steps: 60000
  inference_token: True
  rollout_num: 1
  decoder:
    <<: *time_info
    num_map_layers: 3
    num_agent_layers: 6
    a2a_radius: 60
    pl2pl_radius: 10
    pl2a_radius: 30
    time_span: 30
  diffusion:
    future_chunk_steps: 5
    num_steps: 16
    num_layers: 2
    eps: 1.0e-3
    min_t: 1.0e-3
    ntp_aux_loss_weight: 0.2
    use_agent_context: true
    use_type_embedding: true
    use_map_context: true
    max_map_tokens: 128
    freeze_encoder: false
