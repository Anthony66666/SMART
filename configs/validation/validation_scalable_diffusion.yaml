time_info: &time_info
  num_historical_steps: 11
  num_future_steps: 80
  token_size: 2048

Dataset:
  root:
  batch_size: 4
  shuffle: True
  num_workers: 4
  pin_memory: True
  persistent_workers: True
  train_raw_dir:
  val_raw_dir: ["/home/anthony/SimAgentJEPA/data/waymo/validation"]
  test_raw_dir:
  TargetBuilder: WaymoTargetBuilder
  train_processed_dir:
  val_processed_dir:
  test_processed_dir:
  dataset: "scalable"
  <<: *time_info

Trainer:
  strategy: ddp_find_unused_parameters_true
  accelerator: "gpu"
  devices: 1
  max_epochs: 32
  save_ckpt_path:
  num_nodes: 1
  mode:
  ckpt_path:
  precision: 32
  accumulate_grad_batches: 1

Model:
  mode: "validation"
  predictor: "smart_diffusion"
  dataset: "waymo"
  input_dim: 2
  hidden_dim: 128
  output_dim: 2
  output_head: False
  num_heads: 8
  <<: *time_info
  head_dim: 16
  dropout: 0.1
  num_freq_bands: 64
  lr: 0.0005
  warmup_steps: 0
  total_steps: 32
  decoder:
    <<: *time_info
    num_map_layers: 3
    num_agent_layers: 6
    a2a_radius: 60
    pl2pl_radius: 10
    pl2a_radius: 30
    time_span: 30
  inference_token: True
  rollout_num: 1
  diffusion:
    future_chunk_steps: 5
    num_steps: 32
    num_layers: 6
    eps: 1.0e-3
    min_t: 1.0e-3
    ntp_aux_loss_weight: 0.2
    use_agent_context: true
    use_type_embedding: true
    use_map_context: true
    max_map_tokens: 0  # 0 disables scene-level truncation and follows SMART radius map-agent selection.
    geometry_dropout_prob: 0.0
    target_category_only: true
    low_variance_masking: true
    mask_count_mode: exact
    antithetic_mask_ranking: true
    remask_sampling: false
    remask_confidence_temperature: 1.0
    block_training: true
    block_size_chunks: 4
    block_denoise_steps: 16
    block_mask_prob_min: 0.5
    block_mask_prob_max: 1.0
    block_train_all_blocks: true
    block_loss_weight: clipped_consistent
    freeze_encoder: false
